async function askAI(k,input){const task={quote:'a follow-up text about an estimate the customer has not answered',missed:'a text to a customer whose call was missed',old:'a re-engagement text to an old lead',reply:'a reply to the customer message provided by the user'}[k],sys=`You write short SMS messages for ${S.company||'a small HVAC company'}. Write ${task}. Language: ${S.lang==='es'?'Spanish':'English'}. Rules: friendly and professional, plain words, maximum 60 words, no emojis, no hashtags, never invent prices, dates or facts that are not in the input, no bracket placeholders${S.company?', sign off with the company name':''}. Output only the message text.`;

function csv(){const H=['name','phone','service','quote','status','date','notes'],q=v=>{let s=String(v==null?'':v);if(/^[=@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};dl('customers.csv','text/csv',"\ufeff"+[H.join(',')].concat(data.map(x=>H.map(h=>q(x[h])).join(','))).join('\n'))}
function backup(){dl('hvac-backup.json','application/json',JSON.stringify({data}))}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.data))throw 0;data=j.data;save();render();alert(t('restored'))}catch(e){alert(t('bad_file'))}};r.readAsText(f)}
applyLang();render();
</script></body></html>
